spring:
  application:
    name: warbox
  config:
    # Optional root .env shared with docker-compose and Vite; every value below has a working default.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:warbox}
    username: ${POSTGRES_USER:warbox}
    password: ${POSTGRES_PASSWORD:warbox}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
