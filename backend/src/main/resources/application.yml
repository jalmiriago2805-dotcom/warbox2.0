spring:
  application:
    name: warbox
  config:
    # Optional root .env shared with docker-compose and Vite; every value below has a working default.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:warbox}
    username: ${POSTGRES_USER:warbox}
    password: ${POSTGRES_PASSWORD:warbox}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Mailpit in development (no authentication).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:7d}
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: ${SESSION_TIMEOUT:7d}

warbox:
  # Public URL of the frontend, used to build the links sent by e-mail.
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: "${MAIL_FROM:Warbox <no-reply@warbox.local>}"
  auth:
    email-verification-ttl: 24h
    password-reset-ttl: 1h
    email-cooldown: 60s
  cloudflare:
    # Cloudflare Stream. Without account-id/api-token the video endpoints answer 502 VIDEO_PROVIDER_UNAVAILABLE.
    api-base-url: ${CLOUDFLARE_API_BASE_URL:https://api.cloudflare.com/client/v4}
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_STREAM_API_TOKEN:}
    stream-customer-code: ${CLOUDFLARE_STREAM_CUSTOMER_CODE:}
    webhook-secret: ${CLOUDFLARE_STREAM_WEBHOOK_SECRET:}
    max-duration-seconds: 3600
    webhook-tolerance: 5m
